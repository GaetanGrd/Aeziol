name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Aeziol.slnx

      - name: Build
        run: dotnet build Aeziol.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --solution Aeziol.slnx -c Release --no-build --timeout 60s
