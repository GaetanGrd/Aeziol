name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Aeziol.slnx --artifacts-path .aez-local/ci

      - name: Build
        run: dotnet build Aeziol.slnx -c Release --no-restore --artifacts-path .aez-local/ci

      - name: Test
        shell: pwsh
        run: |
          $runners = @(Get-ChildItem `
            -LiteralPath '.aez-local\ci\bin\Aeziol.Tests' `
            -Filter 'Aeziol.Tests.exe' `
            -File `
            -Recurse)
          if ($runners.Count -ne 1) {
            throw "Expected exactly one test runner, found $($runners.Count)."
          }

          & $runners[0].FullName --timeout 60s
          if ($LASTEXITCODE -ne 0) {
            throw "The test runner exited with code $LASTEXITCODE."
          }
